name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    env:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need tags for git describe
      - name: Determine version from tag
        id: version
        run: |
          VERSION="$(git describe --tags --always)"
          echo "Found version: ${VERSION}"
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "APK_NAME=dev.bluehouse.enablevolte.v${VERSION}.apk" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            /usr/local/lib/android
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties' )}}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Set up OpenJDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@dd83ef4e10ea64da1c6e9484424382da8db64e36
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true
      - name: Install required platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Replace android.jar
        run: |
          curl -L https://github.com/Reginer/aosp-android-jar/raw/main/android-36/android.jar > /usr/local/lib/android/sdk/platforms/android-36/android.jar
      - name: Build APK
        run: ./gradlew assembleRelease -PappVersionName="${{ steps.version.outputs.name }}"
      - name: Align APK with zipalign
        run: $ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-unsigned-aligned.apk
      - name: Save keystore as file
        run: echo "${KEYSTORE_B64}" | base64 -d > keystore.jks
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        if: ${{ env.KEY_PASSWORD != '' }}
      - name: Sign APK
        run: echo "${KEY_PASSWORD}" | $ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner sign --ks keystore.jks --ks-key-alias "${KEY_ALIAS}" --key-pass "env:KEY_PASSWORD" --out "${APK_NAME}" app-unsigned-aligned.apk
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        if: ${{ env.KEY_PASSWORD != '' }}
      - name: Rename unsigned APK
        run: mv app-unsigned-aligned.apk "${APK_NAME}"
        if: ${{ env.KEY_PASSWORD == '' }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}-APK
          path: ${{ env.APK_NAME }}
          retention-days: 30
      - name: Create draft release
        if: github.ref_type == 'tag'
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${APK_NAME}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${APK_NAME}" --draft --title "${GITHUB_REF_NAME}" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
